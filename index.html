<head>
<meta charset="utf-8">

<title>옥상 대난투</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/* VOICE: 시끄럽고 신나는 오락실 난투
   IDEA: 노을 지는 학교 옥상 위 떠 있는 결투장
   PICTURE: 게임 화면 자체가 그림
   COLOUR/TYPE: 노을 주황·보라, 네온 시안 / Black Han Sans
   LAYOUT: 16:9 캔버스를 화면에 꽉 맞춤 */
html,body{margin:0;height:100%;background:#0a0714;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tc{position:fixed;inset:0;pointer-events:none;z-index:20;display:none;font-family:'Black Han Sans',sans-serif}
#tc .b{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);color:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;text-align:center;font-size:min(3.4vmin,17px);line-height:1.1;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(2px)}
#tc .b.on{background:rgba(255,210,63,.45);border-color:#ffd23f;color:#16121f}
#tc .s{border-radius:12px;font-size:min(2.8vmin,14px)}
#tc #stick{position:absolute;pointer-events:auto;left:max(3vmin,env(safe-area-inset-left));bottom:5vmin;width:32vmin;height:32vmin;max-width:190px;max-height:190px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.28)}
#tc #knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6)}
#tc #pad{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;grid-template-columns:repeat(3,13vmin);gap:2vmin;pointer-events:auto}
#tc #pad .b{position:static;width:13vmin;height:13vmin;font-size:4.5vmin}
#rot{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(10,7,20,.94);color:#ffd23f;font:24px 'Black Han Sans',sans-serif;text-align:center}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;outline:none}
</style>

class AI{
  constructor(f,lvl){this.f=f;this.L=lvl;this.cd=0;this.hold={};this.atkT=0;this.shdT=0;this.recCd=0;}
  think(o,dt){
    const f=this.f,L=this.L,S=STAGE.main,press={};let fs;
    this.cd-=dt;this.recCd-=dt;
    if(this.atkT>0){this.atkT-=dt;}this.hold.atk=this.atkT>0;
    if(this.shdT>0){this.shdT-=dt;}this.hold.shd=this.shdT>0;
    const out=()=>({hold:{...this.hold},press,fs});
    if(!f.alive)return{hold:{},press};
    if(f.state==='respawn'){if(Math.random()<.02)press.down=1;return out();}
    if(f.state==='ledge'){if(this.cd<=0){this.cd=.25+Math.random()*.4;this.hold={};const r=Math.random();if(r<.35)press.jump=1;else if(r<.75)this.hold[f.x<0?'right':'left']=1;else press.atk=1;}return out();}
    const off=f.x<S.x1-6||f.x>S.x2+6;
    if(!f.ground&&(off||(f.y>20))){
      const under=f.x>S.x1-30&&f.x<S.x2+30&&f.y>S.y+5;
      const tw=under?(f.x<0?'left':'right'):(f.x<0?'right':'left');this.hold={[tw]:1};this.atkT=0;this.shdT=0;
      if(f.state==='hurt'||f.state==='tumble'||f.move||f.helpless)return out();
      if(under){if(this.recCd<=0&&f.jumps>0&&f.vy>0&&f.y>S.y+S.depth+260){press.jump=1;this.recCd=.4;}return out();}
      const edgeX=f.x<0?S.x1:S.x2,hd=Math.abs(f.x-edgeX);
      if(this.recCd<=0){
        if(f.jumps>0&&f.vy>-50&&f.y>-80){press.jump=1;this.recCd=.3;}
        else if(f.jumps===0&&f.vy>0&&f.y>-40){if((f.ch.id==='A'||f.ch.id==='C')&&hd>330&&!f.sideUsed&&f.y<40)press.spc=1;else{this.hold.up=1;press.spc=1;}this.recCd=.5;}
      }
      return out();
    }
    if(this.cd>0)return out();
    this.cd=[.34,.2,.11][L]*(.6+Math.random()*.8);
    if(!o.alive||o.state==='respawn'){this.hold={};if(Math.abs(f.x)>150)this.hold[f.x>0?'left':'right']=1;return out();}
    const dx=o.x-f.x,dy=o.y-f.y,adx=Math.abs(dx),tw=dx>0?'right':'left',aw=dx>0?'left':'right',sg=Math.sign(dx)||1;
    this.hold={atk:this.hold.atk,shd:this.hold.shd};
    if(f.ground&&o.move&&(o.move.def.hits.length||o.move.def.spawn)&&adx<180&&Math.abs(dy)<150&&Math.random()<[.1,.28,.48][L]){
      this.shdT=.22+Math.random()*.25;this.hold.shd=1;if(Math.random()<.18*L)press[Math.random()<.5?tw:aw]=1;return out();}
    for(const p of G.projs)if(p.owner!==f&&Math.abs(p.x-f.x)<260&&Math.sign(p.vx)===Math.sign(f.x-p.x)&&f.ground&&Math.random()<.25*L){if(Math.random()<.5){this.shdT=.25;this.hold.shd=1;}else press.jump=1;return out();}
    const near=adx<110&&dy>-140&&dy<70;
    if(f.ground){
      if(near){
        if(sg!==f.face&&adx>15){this.hold[tw]=1;this.cd=.04;return out();}
        const r=Math.random();
        if(dy<-85){this.hold.up=1;press.atk=1;fs=o.percent>85&&r<.6;if(fs)this.atkT=.12+Math.random()*.25;}
        else if(o.percent>115-L*12&&r<.5){this.hold[tw]=1;press[tw]=1;press.atk=1;fs=true;this.atkT=.1+Math.random()*.45;}
        else if(r<.3)press.atk=1;
        else if(r<.55){this.hold[tw]=1;press.atk=1;fs=false;}
        else if(r<.72){this.hold.down=1;press.atk=1;fs=Math.random()<.3;if(fs)this.atkT=.2;}
        else if(r<.86)press.jump=1;
        else if(r<.93){this.hold.down=1;press.spc=1;}
        else{press.spc=1;this.hold[tw]=1;}
      }else{
        if(adx>380&&sg===f.face&&Math.random()<.15){press.spc=1;}
        else{this.hold[tw]=1;if(dy<-140&&Math.random()<.6)press.jump=1;else if(adx<260&&Math.random()<.1*L)press.jump=1;else if(adx<220&&adx>120&&Math.random()<.15){press.atk=1;fs=false;}}
        if(((f.x<S.x1+60&&tw==='left')||(f.x>S.x2-60&&tw==='right'))){delete this.hold[tw];}
      }

function uiKey(code){
  if(code==='KeyM'){setMute(!muted);return;}
  const up=['KeyW','ArrowUp'].includes(code),dn=['KeyS','ArrowDown'].includes(code),lf=['KeyA','ArrowLeft'].includes(code),rt=['KeyD','ArrowRight'].includes(code);
  const ok=['Enter','Space','KeyF','KeyJ','KeyZ'].includes(code),back=['Escape','Backspace'].includes(code);
  if(UN.inv&&!['countdown','fight','gameover'].includes(G.state)){if(code==='Enter'||code==='Space')acceptInvite();else if(code==='Escape'||code==='Backspace')declineInvite();return;}
  if(G.state==='intro'){if(code==='Space'||code==='Enter'){SFX.ok&&ac&&SFX.ok();leaveIntro();}return;}
  if(G.state==='profile'){if(PF.pick)pickKey(code,{up,dn,lf,rt});else profKey(code,{up,dn,lf,rt});return;}
  if(netKey(code,{up,dn,lf,rt,ok,back}))return;

      if(back){G.menuSub=null;SFX.blip();return;}
      if(ok){const id=SMID[G.smenu];if(id==='online'){G.state='online';NET.om=0;NET.msg='';}else if(id==='chal'){G.state='chal';G.chalP=0;G.chalT=0;}else{G.mode=id;G.state='select';G.selFocus=0;}SFX.ok();}
      return;}
    const ML=MENU.length,mid=MID[G.menu];if(up){G.menu=(G.menu+ML-1)%ML;SFX.blip();}if(dn){G.menu=(G.menu+1)%ML;SFX.blip();}

  }else if(G.state==='ach'){if(back||ok){G.state='title';SFX.blip();}
  }else if(G.state==='chal'){const Lk=lockedList(),n=Lk.length;
    if(n){if(lf){G.chalP=(G.chalP+n-1)%n;G.chalT=0;G.chalDir=-1;SFX.blip();}if(rt){G.chalP=(G.chalP+1)%n;G.chalT=0;G.chalDir=1;SFX.blip();}
      if(ok){G.chalI=Lk[Math.min(G.chalP,n-1)];G.mode='chal';G.state='select';G.selFocus=0;SFX.ok();}}
    else if(ok){G.state='title';SFX.blip();}
    if(back){G.state='title';SFX.blip();}
  }else if(G.state==='select'){
    const tut=G.mode==='tut',solo=G.mode!=='2p';
    if(!tut&&(code==='KeyW'||code==='KeyS'||(solo&&(code==='ArrowUp'||code==='ArrowDown')))){G.selFocus=(G.selFocus+((code==='KeyS'||code==='ArrowDown')?1:2))%3;SFX.blip();}
    if(code==='KeyA'||code==='KeyD'||(solo&&(code==='ArrowLeft'||code==='ArrowRight')))selAdjust(0,code==='KeyD'||code==='ArrowRight',tut);

    drawAvatar(f,fx+58,ry+32,22);txt(f.name,fx+96,ry+28,22,'#fff','left',FONT);const mc2=CH.find(c=>c.id===f.main);txt(`#${f.code} · 주챔 ${mc2?mc2.name:'없음'} · 승리 ${f.w}`,fx+96,ry+50,14,sel?'#fff':'#bfb0d6','left',FONT2);
    ctx.fillStyle=f.on?'#5dff9a':'#5a4a7a';ctx.beginPath();ctx.arc(fx+fw-60,ry+32,7,0,TAU);ctx.fill();txt(f.on?'접속 중':'오프라인',fx+fw-74,ry+38,14,f.on?'#5dff9a':'#9a8db3','right',FONT2);});
  if(PF.msg)txt(PF.msg,W/2,H-14,18,'#ffd23f','center',FONT2,4);else txt('W/S 이동  ·  Enter 선택  ·  A/D 바꾸기  ·  Esc 뒤로',W/2,H-14,17,'#bfb0d6','center',FONT2);
  if(PF.found){ctx.fillStyle='rgba(6,3,14,.7)';ctx.fillRect(0,0,W,H);txt('사용자를 찾았어요',W/2,220,36,'#fff','center',FONT,6);drawProfileCard(PF.found,W/2-250,250,500,160,'검색 결과','#5dff9a');txt('Enter 친구 추가   ·   Esc 닫기',W/2,460,24,'#fff','center',FONT2,4);}
  if(PF.pick)drawPicker();
}
/* ================= MAIN LOOP ================= */
let last=performance.now(),acc=0;
function frame(now){
  touchUI();
  const rdt=clamp((now-last)/1000,0,.05);last=now;G.rt+=rdt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.state==='intro'){drawIntro(rdt);updateParticles&&0;}
  else if(G.state==='title'){drawTitle();}
  else if(G.state==='select'){drawSelect();}
  else if(G.state==='chal'){drawChal();}
  else if(G.state==='ach'){drawAch();}
  else if(G.state==='netlobby'){if(!G.practice)startPractice();practiceFrame(rdt);}
  else if(G.state==='online'||G.state==='netjoin'||G.state==='netlobby'){drawOnline();}
  else if(G.state==='netselect'){drawSelect();drawReady();if(NET.msg)txt(NET.msg,W/2,630,18,'#ff9a9a','center',FONT2,3);}
  else if(G.state==='profile'){drawProfile();}
  else{
    if(NET.guest){netGuestTick(rdt);}
    else if(!G.paused&&G.state!=='results'){
      if(G.hitstop>0)G.hitstop-=rdt;
      else{const ts=G.slowT>0?.3:1;acc+=rdt*ts;let n=0;while(acc>=STEP&&n<5){savePrev();simStep(STEP);acc-=STEP;n++;}if(n>=5)acc=0;G.alpha=clamp(acc/STEP,0,1);updateParticles(rdt*ts);}
      G.slowT=Math.max(0,G.slowT-rdt);updateCam(rdt);
      if(G.state==='gameover'){G.overT-=rdt;if(G.overT<=0){G.state='results';G.overT=.8;}}
    } else if(G.state==='results'){G.overT-=rdt;if(G.fighters.length){acc+=rdt;while(acc>=STEP){G.fighters.forEach((f,i)=>{if(f.alive)updateFighter(f,buildInput(i,{}),STEP);});updateParticles(STEP);acc-=STEP;}}}
    G.shake=Math.max(0,G.shake-G.shake*rdt*9-rdt*4);
    const sh=G.shake,tt=G.rt;ctx.save();ctx.translate(sh*(Math.sin(tt*71)*.6+Math.sin(tt*113)*.4),sh*(Math.sin(tt*83)*.6+Math.sin(tt*127)*.4));
    const c=G.cam;const zsave=c.z,xs=c.x,ys=c.y;
    if(c.pz>.005){c.z=zsave*(1+c.pz);c.x=lerp(xs,c.px,Math.min(1,c.pz*3));c.y=lerp(ys,c.py,Math.min(1,c.pz*3));}
    const ip=!NET.guest&&G.state!=='results';if(ip)interpOn();
    drawBG();drawStage();drawQuakes();drawSwamps();G.fighters.forEach(drawShadow);
    const order=[...G.fighters].sort((a,b)=>(a.move?1:0)-(b.move?1:0));order.forEach(drawGhosts);order.forEach(f=>drawFighter(f));drawHooks();
    drawProjs();drawParticles();if(ip)interpOff();
    c.z=zsave;c.x=xs;c.y=ys;
    ctx.restore();
    drawForeground();drawWeather();drawVignette();drawImpact(rdt);drawBanner(rdt);drawKoFx(rdt);if(G.state!=='results'){drawOffscreen();drawHUD();}if(G.mode==='tut')drawTut();drawTrain();drawAnn(rdt);
    drawSubmergeFX(rdt);
    if(G.flash>0){ctx.globalAlpha=Math.min(.6,G.flash*2.4);ctx.fillStyle=G.flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;G.flash-=rdt;}
    if(G.paused){ctx.fillStyle='rgba(10,6,22,.7)';ctx.fillRect(0,0,W,H);txt('일시정지',W/2,H/2-20,90,'#fff','center',FONT,12);txt('Esc 계속   ·   Q 메뉴로',W/2,H/2+50,28,'#ffd23f','center',FONT2,4);}
    if(G.state==='results')drawResults();
    if(NET.menu){ctx.fillStyle='rgba(10,6,22,.72)';ctx.fillRect(0,0,W,H);txt('온라인 대전 중',W/2,H/2-30,60,'#fff','center',FONT,10);txt('Esc 계속   ·   Q 방 나가기',W/2,H/2+30,26,'#ffd23f','center',FONT2,4);}
  }
  drawInvite();
  netTick();
  if(!ac&&(G.state==='title')){txt('아무 키나 누르면 소리가 켜져요',W/2,H-56,18,'#ffd9ef','center',FONT2);}
  requestAnimationFrame(frame);
}
G.state='intro';
requestAnimationFrame(frame);
cv.focus();
}

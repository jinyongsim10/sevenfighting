function ledgeUpdate(f,inp,dir,dt){

const taken={'-1':null,'1':null};
function tryLedge(f){
  if(f.ground||f.ledgeCD>0||f.vy+f.lvy<0)return;
  if(!(f.state==='air'||f.state==='dodge'||(f.move&&f.move.def.helpless&&f.move.t>.3)))return;
  const S=STAGE.main;
  for(const side of [-1,1]){const ex=side<0?S.x1:S.x2;
    if(taken[side]&&taken[side]!==f)continue;
    if((f.x-ex)*side>-18&&Math.abs(f.x-ex)<70&&f.y>S.y+60&&f.y<S.y+180){
      f.state='ledge';f.ledgeSide=side;f.face=-side;f.x=ex+side*24;f.y=S.y+118;f.vx=f.vy=f.lvx=f.lvy=0;f.inv=Math.max(f.inv,.5);f.jumps=f.ch.airJumps;f.helpless=false;f.sideUsed=false;f.airdodged=false;f.move&&chargeOff(f.idx);f.move=null;f.st=0;f.ff=false;taken[side]=f;SFX.ledge();tutEvent('ledge',f);addP({type:'star',x:ex,y:S.y,size:30,life:.15,color:'#bff'});return;}
  }

function updateFighter(f,inp,dt){

  if(f.state==='dead'){f.st-=dt;if(f.st<=0){if(f.stocks>0)respawn(f);else f.state='out';}return;}
  if(f.state==='out')return;

  f.squash+=(1-f.squash)*Math.min(1,dt*14);
  if(f.state!=='shield')f.shield=Math.min(50,f.shield+dt*7);
  const dir=(inp.h.right?1:0)-(inp.h.left?1:0);
  if(taken[-1]===f&&f.state!=='ledge')taken[-1]=null;if(taken[1]===f&&f.state!=='ledge')taken[1]=null;
  if(f.elecT>0){f.elecT-=dt;if(Math.random()<.35)zap(f.x+rand(-20,20),f.y-rand(30,140),1,40);}
  if(f.ch.reactor&&f.alive){const was=f.reactor||0;f.reactor=Math.min(100,was+dt*3);if(was<100&&f.reactor>=100){ring(f.x,f.y-90,'#4fe3ff',90);tone('square',880,1760,.15,.08);addP({type:'text',x:f.x,y:f.y-200,text:'리액터 충전 완료',size:26,life:.8,vy:-60,color:'#4fe3ff'});}if(f.reactor>=100&&Math.random()<.15)zap(f.x,f.y-95,1,45);}

  if(f.state==='respawn'){f.st-=dt;f.vx=f.vy=0;if(f.st<=0||dir||inp.p.jump||inp.p.atk||inp.p.spc||inp.p.down||inp.p.shd){f.state='air';f.ground=false;}updatePose(f,dt);return;}

      if(f.state==='tumble'&&f.lvx*f.lvx+f.lvy*f.lvy>640000&&(f.trailT+=dt)>.016){f.trailT=0;addP({type:'trail',x:f.x,y:f.y-75,size:30,life:.45,color:Math.hypot(f.lvx,f.lvy)>1500?f.pal.acc:'#ddd'});}

function uiKey(code){
  if(code==='KeyM'){setMute(!muted);return;}
  const up=['KeyW','ArrowUp'].includes(code),dn=['KeyS','ArrowDown'].includes(code),lf=['KeyA','ArrowLeft'].includes(code),rt=['KeyD','ArrowRight'].includes(code);
  const ok=['Enter','Space','KeyF','KeyJ','KeyZ'].includes(code),back=['Escape','Backspace'].includes(code);
  if(netKey(code,{up,dn,lf,rt,ok,back}))return;
  if(G.state==='title'){
    if(G.showHelp){if(ok||back){G.showHelp=false;SFX.blip();}return;}
    if(up){G.menu=(G.menu+6)%7;SFX.blip();}if(dn){G.menu=(G.menu+1)%7;SFX.blip();}
    if(G.menu===4&&(lf||rt)){G.stocks=clamp(G.stocks+(rt?1:-1),1,5);SFX.blip();}
    if(G.menu===5&&(lf||rt)){G.cpuLvl=clamp(G.cpuLvl+(rt?1:-1),0,2);SFX.blip();}
    if(ok){if(G.menu===2){G.state='online';NET.om=0;NET.msg='';SFX.ok();}else if(G.menu<=3){G.mode=['tut','cpu',0,'2p'][G.menu];G.state='select';SFX.ok();}else if(G.menu===6){G.showHelp=true;SFX.ok();}else if(G.menu===4){G.stocks=G.stocks%5+1;SFX.blip();}else{G.cpuLvl=(G.cpuLvl+1)%3;SFX.blip();}}
  }else if(G.state==='select'){
    const N=CH.length+1;
    if(code==='KeyA'||code==='KeyD'){G.sel[0]=(G.sel[0]+(code==='KeyD'?1:N-1))%N;SFX.blip();prevBump(0);}
    if((code==='ArrowLeft'||code==='ArrowRight')&&G.mode!=='cpu'){G.sel[1]=(G.sel[1]+(code==='ArrowRight'?1:N-1))%N;SFX.blip();prevBump(1);}
    if(ok){SFX.ok();startBattle();}if(back){G.state='title';SFX.blip();}
  }else if(G.state==='fight'||G.state==='countdown'){
    if(code==='Escape'||code==='KeyP'){G.paused=!G.paused;SFX.blip();}
    else if(code==='Enter'&&G.mode==='tut'&&G.tut&&!G.paused&&G.tut.i<TUT_STEPS.length&&G.tut.ok<=0){tutPass();}
    else if(G.paused&&code==='KeyQ'){G.paused=false;G.state='title';chargeOff(0);chargeOff(1);}
  }else if(G.state==='results'){
    if(G.overT<=0){if(code==='Enter'||code==='KeyR'||code==='Space'){SFX.ok();startBattle();}else if(back||code==='KeyQ'){G.state='title';SFX.blip();}}
  }
}

  if(st==='online'){
    ['방 만들기','방 참가하기'].forEach((t,i)=>{const sel=NET.om===i,y=170+i*90;ctx.fillStyle=sel?'#ff4d4d':'rgba(22,14,40,.9)';ctx.beginPath();ctx.roundRect(W/2-260,y,520,70,16);ctx.fill();
      txt(t,W/2,y+46,sel?36:30,'#fff','center',FONT,sel?5:0);});
    txt(NET.om?'친구에게 받은 4자리 코드를 입력해서 들어가요':'방을 만들고 4자리 코드를 친구에게 알려 주세요',W/2,370,20,'#9fe8ff');
    const tips=['같은 게임 페이지를 각자 기기에서 열면 와이파이가 달라도 연결돼요','방장 = P1 (조작: WASD/방향키 · J 공격 · K 필살 · L 방어)  /  참가자 = P2 (같은 키)','방장 화면이 게임을 계산하고, 참가자는 조작만 보내요'];
    tips.forEach((t,i)=>txt(t,W/2,440+i*32,18,'#d8cbe8','center',FONT2));
    if(ROOMTRIED&&!ROOM)txt('온라인 연결을 불러오지 못했어요 — 인터넷 연결을 확인하고 새로고침해 주세요',W/2,560,18,'#ff9a9a','center',FONT2);
    txt('↑/↓ 선택   ·   Enter 결정   ·   Esc 뒤로',W/2,H-24,19,'#bfb0d6','center',FONT2);}
  if(st==='netjoin'){txt('방 코드 입력',W/2,190,40,'#fff','center',FONT,6);
    for(let i=0;i<4;i++){const x=W/2-170+i*90;ctx.fillStyle='rgba(22,14,40,.95)';ctx.beginPath();ctx.roundRect(x,230,70,90,14);ctx.fill();ctx.strokeStyle=i===NET.typing.length?'#ffd23f':'rgba(255,255,255,.25)';ctx.lineWidth=3;ctx.stroke();txt(NET.typing[i]||'',x+35,295,58,'#fff','center',FONT);}
    txt('숫자키로 입력 · Backspace 지우기 · Enter 참가 · Esc 뒤로',W/2,380,20,'#d8cbe8','center',FONT2);}
  if(st==='netlobby'){
    txt('방 코드',W/2,120,24,'#9fe8ff','center',FONT2);txt(NET.code.split('').join(' '),W/2,190,72,'#ffd23f','center',FONT,10);
    const hp=NET.role==='h'?{ch:G.sel[0]}:NET.hp,gp=NET.role==='g'?{ch:G.sel[1]}:NET.gp;
    [[hp,'방장 · P1',0],[gp,'참가자 · P2',1]].forEach(([p,label,i])=>{const x=W/2+(i?220:-220),y=250;ctx.fillStyle='rgba(14,9,28,.92)';ctx.beginPath();ctx.roundRect(x-170,y,340,300,22);ctx.fill();ctx.strokeStyle=PCOL[i];ctx.lineWidth=4;ctx.stroke();
      txt(label+(i===NET.me?'  (나)':''),x,y+40,22,PCOL[i],'center',FONT);
      if(!p){txt('기다리는 중...',x,y+170,28,'#9a8db3','center',FONT2);for(let d=0;d<3;d++){ctx.fillStyle=Math.floor(G.rt*3)%3===d?'#fff':'#4a3d63';ctx.beginPath();ctx.arc(x-24+d*24,y+210,6,0,TAU);ctx.fill();}return;}
      const ci=+p.ch;if(Number.isInteger(ci)&&ci>=0&&ci<CH.length){faceCircle(CH[ci].faces.norm,x,y+140,70,PCOL[i]);txt(CH[ci].name,x,y+258,36,'#fff','center',FONT,6);}
      else{faceCircle(CH[Math.floor(G.rt*6)%CH.length].faces.norm,x,y+140,70,PCOL[i]);txt('랜덤',x,y+258,36,'#fff','center',FONT,6);}
      if(i===NET.me)txt(i?'◀ A / D ▶':'◀ A / D ▶',x,y+290,16,'#ffd23f','center',FONT2);});
    txt('VS',W/2,410,54,'#ffd23f','center',FONT,10);
    txt(NET.role==='h'?(NET.gp?'Enter 로 시작!  (맵은 랜덤 · 스톡 '+G.stocks+')':'친구에게 방 코드를 알려 주세요'):(NET.hp?'방장이 시작하면 바로 들어가요':'방장을 찾는 중... 코드가 맞는지 확인하세요'),W/2,610,24,'#fff','center',FONT2,4);
    txt('A / D 캐릭터 바꾸기   ·   Esc 방 나가기',W/2,H-24,19,'#bfb0d6','center',FONT2);}
  if(NET.msg)txt(NET.msg,W/2,st==='netlobby'?650:420,20,'#ff9a9a','center',FONT2,3);
}

/* ================= MAIN LOOP ================= */
let last=performance.now(),acc=0;
function frame(now){
  const rdt=clamp((now-last)/1000,0,.05);last=now;G.rt+=rdt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.state==='title'){drawTitle();}
  else if(G.state==='select'){drawSelect();}
  else if(G.state==='online'||G.state==='netjoin'||G.state==='netlobby'){drawOnline();}
  else{
    if(NET.guest){netGuestTick(rdt);}
    else if(!G.paused&&G.state!=='results'){
      if(G.hitstop>0)G.hitstop-=rdt;
      else{const ts=G.slowT>0?.3:1;acc+=rdt*ts;let n=0;while(acc>=STEP&&n<4){simStep(STEP);acc-=STEP;n++;}if(n>=4)acc=0;}
      G.slowT=Math.max(0,G.slowT-rdt);updateCam(rdt);
      if(G.state==='gameover'){G.overT-=rdt;if(G.overT<=0){G.state='results';G.overT=.8;}}
    } else if(G.state==='results'){G.overT-=rdt;if(G.fighters.length){acc+=rdt;while(acc>=STEP){G.fighters.forEach((f,i)=>{if(f.alive)updateFighter(f,buildInput(i,{}),STEP);});updateParticles(STEP);acc-=STEP;}}}
    G.shake=Math.max(0,G.shake-G.shake*rdt*9-rdt*4);
    const sh=G.shake;ctx.save();ctx.translate(rand(-sh,sh),rand(-sh,sh));
    const c=G.cam;const zsave=c.z,xs=c.x,ys=c.y;
    if(c.pz>.005){c.z=zsave*(1+c.pz);c.x=lerp(xs,c.px,Math.min(1,c.pz*3));c.y=lerp(ys,c.py,Math.min(1,c.pz*3));}
    drawBG();drawStage();G.fighters.forEach(drawShadow);
    const order=[...G.fighters].sort((a,b)=>(a.move?1:0)-(b.move?1:0));order.forEach(drawGhosts);order.forEach(f=>drawFighter(f));
    drawProjs();drawParticles();
    c.z=zsave;c.x=xs;c.y=ys;
    ctx.restore();
    drawWeather();drawImpact(rdt);drawBanner(rdt);drawKoFx(rdt);drawOffscreen();drawHUD();if(G.mode==='tut')drawTut();drawAnn(rdt);
    if(G.flash>0){ctx.globalAlpha=Math.min(.6,G.flash*2.4);ctx.fillStyle=G.flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;G.flash-=rdt;}
    if(G.paused){ctx.fillStyle='rgba(10,6,22,.7)';ctx.fillRect(0,0,W,H);txt('일시정지',W/2,H/2-20,90,'#fff','center',FONT,12);txt('Esc 계속   ·   Q 메뉴로',W/2,H/2+50,28,'#ffd23f','center',FONT2,4);}
    if(G.state==='results')drawResults();
    if(NET.menu){ctx.fillStyle='rgba(10,6,22,.72)';ctx.fillRect(0,0,W,H);txt('온라인 대전 중',W/2,H/2-30,60,'#fff','center',FONT,10);txt('Esc 계속   ·   Q 방 나가기',W/2,H/2+30,26,'#ffd23f','center',FONT2,4);}
  }
  netTick();
  if(!ac&&(G.state==='title')){txt('아무 키나 누르면 소리가 켜져요',W/2,H-56,18,'#ffd9ef','center',FONT2);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
}
